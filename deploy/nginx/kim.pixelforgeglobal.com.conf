# EduManage — reverse proxy for the docker-compose stack (see
# docker-compose.yml at the repo root). Deploy target on this server:
# /etc/nginx/conf.d/pixelforge/kim.conf — matches the layout of the other
# pixelforge.* vhosts (ssl-params.inc points at the existing wildcard
# *.pixelforgeglobal.com cert, so no separate certbot run is needed).

server {
    listen 80;
    listen [::]:80;
    server_name kim.pixelforgeglobal.com;
    return 301 https://kim.pixelforgeglobal.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kim.pixelforgeglobal.com;
    include /etc/nginx/snippets/error-pages.conf;
    client_max_body_size 20M;

    include /etc/nginx/conf.d/pixelforge/ssl-params.inc;

    # Backend API — routers already carry the /api/v1 prefix, so no rewrite.
    location /api/ {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Next.js frontend
    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
