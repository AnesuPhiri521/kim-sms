# Reverse proxy for the EduManage docker-compose stack (see docker-compose.yml
# at the repo root). Deployed to /etc/nginx/sites-available/ on the server —
# see scripts/deploy.sh for the full setup sequence.
#
# Initial state is HTTP-only; `certbot --nginx -d kim.pixelforgeglobal.com`
# rewrites this file in place to add the 443 server block and the HTTP->HTTPS
# redirect, so no ssl_certificate paths are hand-maintained here.

server {
    listen 80;
    listen [::]:80;
    server_name kim.pixelforgeglobal.com;

    client_max_body_size 20m;

    # Backend API — routers already carry the /api/v1 prefix, so no rewrite.
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js frontend
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
