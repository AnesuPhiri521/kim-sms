[project]
name = "edumanage-backend"
version = "0.1.0"
description = "EduManage backend — FastAPI + SQLAlchemy + SQLite"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "python-multipart>=0.0.17",
    "apscheduler>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PYI", "RUF", "DTZ"]
ignore = [
    "B008",   # Depends(...) in argument defaults is the required FastAPI DI pattern
    "UP046",  # Generic[T] class syntax kept for Pydantic 2 generic-model compatibility
    "DTZ011", # date.today() is fine for a `date` column (no time-of-day/tz component)
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
